[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scanner-backend"
version = "0.1.0"
description = "涉案卷烟智能统计系统后端"
requires-python = ">=3.12,<3.13"
dependencies = [
  "argon2-cffi>=25.1,<26",
  "fastapi>=0.116,<1",
  "openpyxl>=3.1,<4",
  "pydantic-settings>=2.10,<3",
  "pymysql>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
