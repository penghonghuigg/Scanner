worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;
    client_max_body_size 20m;

    map $http_x_forwarded_for $scanner_client_ip {
        "~^(?<first_ip>[^,]+)" $first_ip;
        default $remote_addr;
    }

    map $http_x_forwarded_proto $scanner_forwarded_proto {
        "" $scheme;
        default $http_x_forwarded_proto;
    }

    limit_req_zone $scanner_client_ip zone=login_limit:10m rate=10r/m;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /api/v1/auth/login {
            limit_req zone=login_limit burst=10 nodelay;
            proxy_pass http://scanner-api:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $scanner_client_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scanner_forwarded_proto;
            proxy_set_header X-Request-ID $request_id;
        }

        location /api/ {
            proxy_pass http://scanner-api:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $scanner_client_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scanner_forwarded_proto;
            proxy_set_header X-Request-ID $request_id;
            proxy_read_timeout 60s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
